<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 760" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="10" y="10" width="420" height="740" rx="44" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <rect x="24" y="28" width="392" height="704" rx="32" fill="#0f172a"/>

  <!-- Title -->
  <text x="44" y="72" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="bold" fill="#38bdf8">🚗 Front-Seat Parent Remote</text>
  <text x="44" y="94" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" fill="#94a3b8">Control rear-seat screens without turning around:</text>

  <!-- Target Selector -->
  <rect x="44" y="110" width="110" height="42" rx="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <text x="99" y="136" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">📱📱 Both</text>

  <rect x="165" y="110" width="110" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="220" y="136" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">📱 Screen #1</text>

  <rect x="286" y="110" width="110" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="341" y="136" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">📱 Screen #2</text>

  <!-- Live Playback Controls Row 1 -->
  <rect x="44" y="164" width="82" height="40" rx="10" fill="#eab308"/>
  <text x="85" y="189" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">⏸️ Pause</text>

  <rect x="134" y="164" width="82" height="40" rx="10" fill="#22c55e"/>
  <text x="175" y="189" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">▶️ Resume</text>

  <rect x="224" y="164" width="76" height="40" rx="10" fill="#3b82f6"/>
  <text x="262" y="189" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">⏭️ Next</text>

  <rect x="308" y="164" width="88" height="40" rx="10" fill="#ef4444"/>
  <text x="352" y="189" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">🌙 Blackout</text>

  <!-- Touch Shield Lock Row 2 -->
  <rect x="44" y="214" width="170" height="40" rx="10" fill="#7c3aed"/>
  <text x="129" y="239" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">🔒 Lock Touch (Shield)</text>

  <rect x="224" y="214" width="172" height="40" rx="10" fill="#0ea5e9"/>
  <text x="310" y="239" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">☀️ Wake / Unlock Touch</text>

  <!-- Search Input -->
  <rect x="44" y="268" width="256" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="58" y="294" font-family="sans-serif" font-size="14" fill="#94a3b8">Search show or movie...</text>
  <rect x="308" y="268" width="88" height="42" rx="10" fill="#10b981"/>
  <text x="352" y="294" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Search</text>

  <!-- Quick Category Grid -->
  <g filter="url(#cardShadow)">
    <rect x="44" y="324" width="170" height="46" rx="10" fill="#1e88e5"/>
    <text x="60" y="352" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">🐶 Bluey</text>

    <rect x="226" y="324" width="170" height="46" rx="10" fill="#e53935"/>
    <text x="242" y="352" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">🐾 Paw Patrol</text>

    <rect x="44" y="380" width="170" height="46" rx="10" fill="#d81b60"/>
    <text x="60" y="408" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">🐭 Mickey Mouse</text>

    <rect x="226" y="380" width="170" height="46" rx="10" fill="#ec407a"/>
    <text x="242" y="408" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">🐷 Peppa Pig</text>

    <rect x="44" y="436" width="352" height="46" rx="10" fill="#0284c7"/>
    <text x="220" y="464" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">🏠 My Jellyfin Library (Server Movies)</text>
  </g>

  <!-- Results List Preview -->
  <rect x="44" y="498" width="352" height="72" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="54" y="508" width="84" height="52" rx="8" fill="#1e88e5"/>
  <text x="96" y="540" font-size="24" text-anchor="middle">🐶</text>
  <text x="150" y="530" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Bluey - Full Marathon</text>
  <text x="150" y="550" font-family="sans-serif" font-size="12" fill="#94a3b8">45:12 • Ad-Free MP4</text>
  <rect x="314" y="516" width="70" height="36" rx="8" fill="#f59e0b"/>
  <text x="349" y="539" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">▶️ Cast</text>

  <rect x="44" y="580" width="352" height="72" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="54" y="590" width="84" height="52" rx="8" fill="#0284c7"/>
  <text x="96" y="622" font-size="24" text-anchor="middle">🦁</text>
  <text x="150" y="612" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">The Lion King (1994)</text>
  <text x="150" y="632" font-family="sans-serif" font-size="12" fill="#94a3b8">Jellyfin • Live HLS 720p</text>
  <rect x="314" y="598" width="70" height="36" rx="8" fill="#f59e0b"/>
  <text x="349" y="621" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">▶️ Cast</text>

  <!-- Toast Notification -->
  <rect x="54" y="668" width="332" height="42" rx="10" fill="#10b981"/>
  <text x="220" y="694" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">✅ Sent to Screen #1 &amp; Screen #2!</text>
</svg>
